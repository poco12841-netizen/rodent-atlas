name: Copy NYC report for site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p frontend/public/data
          cp data/reports/nyc_report.json frontend/public/data/nyc_report.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add frontend/public/data/nyc_report.json
          git diff --cached --quiet || git commit -m "Copy NYC report for site"
          git push
