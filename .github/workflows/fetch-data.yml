name: Fetch rodent data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_data.py
      - name: Save data to the repository
        run: |
          git config user.name "rodent-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Update rodent data" || echo "Nothing to commit"
          git push
