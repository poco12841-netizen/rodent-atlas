name: NYC summary for map
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/nyc_summary.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add frontend/public/data/nyc_summary.json
          git diff --cached --quiet || git commit -m "Add NYC summary data for map"
          git push
